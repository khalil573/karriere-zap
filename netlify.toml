# Seit 29.10.2026: eigener Bewerbungs-Eingang (Formspree-Ersatz) als Netlify Functions.
# Die Site veröffentlicht weiterhin den Repo-Root (alle Landingpages liegen dort) — deshalb
# sperren die Redirects unten alles, was nicht ausgeliefert werden darf.

[build]
  publish = "."

[build.environment]
  # 22 (>= 22.12) ist Pflicht seit @netlify/blobs 11 (bedingte Writes der Drossel).
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Nicht-öffentliche Dateien hart auf 404 (force = auch wenn die Datei existiert).
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/test/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true
